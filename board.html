<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>질문 게시판 - 전남온라인학교 FAQ</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="images/logo.png" alt="전남온라인학교"> 전남온라인학교
  </a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html">FAQ</a>
      <a href="board.html" class="active">질문 게시판</a>
    </div>
    <div id="authArea"></div>
  </div>
</nav>

<div class="container">
  <div class="board-header">
    <div>
      <h2>질문 게시판</h2>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:0.2rem">FAQ에서 찾지 못한 질문을 남겨주세요. 관리자가 답변해드립니다.</p>
    </div>
    <button class="btn btn-primary" id="writeBtn">+ 질문하기</button>
  </div>

  <div class="notice">
    <span>💡</span>
    <span>질문 작성은 Google 로그인이 필요합니다. 답변 완료된 질문은 자주 묻는 질문(FAQ)으로 등록될 수 있습니다.</span>
  </div>

  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button class="cat-tab active" data-filter="전체">전체</button>
    <button class="cat-tab" data-filter="답변대기">답변 대기</button>
    <button class="cat-tab" data-filter="답변완료">답변 완료</button>
  </div>

  <div class="post-list" id="postList">
    <div class="loading">게시글을 불러오는 중...</div>
  </div>
</div>

<!-- 질문 작성 모달 -->
<div class="modal-overlay" id="writeModal">
  <div class="modal">
    <h3>✏️ 질문 작성</h3>
    <div class="form-group">
      <label>작성자</label>
      <input type="text" id="authorInput" readonly style="background:#f9fafb;color:var(--text-muted)">
    </div>
    <div class="form-group">
      <label>카테고리</label>
      <select id="categoryInput">
        <option value="">카테고리 선택</option>
        <option>수업 운영</option>
        <option>출결 관리</option>
        <option>시스템 이용</option>
        <option>학적 관리</option>
        <option>기타</option>
      </select>
    </div>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="titleInput" placeholder="질문 제목을 입력하세요">
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea id="contentInput" placeholder="질문 내용을 자세히 작성해주세요"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="writeCancelBtn">취소</button>
      <button class="btn btn-primary" id="writeSubmitBtn">등록하기</button>
    </div>
  </div>
</div>

<!-- 로그인 안내 모달 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal" style="max-width:400px;text-align:center">
    <div style="font-size:2.5rem;margin-bottom:0.5rem">🔐</div>
    <h3>로그인이 필요합니다</h3>
    <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:1.5rem">질문을 작성하려면 Google 계정으로 로그인해주세요.</p>
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Google 계정으로 로그인
    </button>
    <div style="margin-top:1rem">
      <button class="btn btn-secondary btn-sm" id="loginModalCancelBtn">닫기</button>
    </div>
  </div>
</div>

<!-- 게시글 상세 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="detailCloseBtn">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/board.js"></script>
</body>
</html>
